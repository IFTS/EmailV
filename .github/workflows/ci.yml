# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint check (basic syntax)
        run: |
          node --check backend/server.js || echo "Syntax check done"
      
      - name: Validate HTML exists
        run: test -f index.html && echo "HTML file exists"
      
      - name: Check for TODO comments
        run: |
          if grep -r "TODO" --include="*.js" --include="*.html" .; then
            echo "Warning: TODO comments found"
          else
            echo "No TODO comments - good!"
          fi
      
      - name: Security check
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r "password\s*=\s*['\"]" --include="*.js" . 2>/dev/null | grep -v "process.env\|SMTP_PASS"; then
            echo "Warning: Potential hardcoded passwords"
          else
            echo "No hardcoded passwords found"
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify files exist
        run: |
          ls -la
          echo "Files verified"
      
      - name: List HTML structure
        run: |
          head -50 index.html 2>/dev/null || echo "HTML readable"