name: EmailV Monorepo

services:
  # ============ DATABASE ============
  database:
    image: postgres:16-alpine
    container_name: emailv_db
    environment:
      POSTGRES_DB: emailv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emailv"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - emailv-net

  # ============ REDIS CACHE ============
  redis:
    image: redis:7-alpine
    container_name: emailv_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - emailv-net

  # ============ API LAYER ============
  api_layer:
    build:
      context: ../..
      dockerfile: packages/database/Dockerfile.api
    container_name: emailv_api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@database:5432/emailv?schema=public
      - REDIS_URL=redis://redis:6379
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY:-changeme-32chars!}
      - NODE_ENV=production
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - emailv-net

  # ============ WEB INTERFACE ============
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: emailv_web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api_layer
    restart: unless-stopped
    networks:
      - emailv-net

  # ============ NGINX PROXY ============
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_layer
      - web
    restart: unless-stopped
    networks:
      - emailv-net

volumes:
  pgdata:
  redisdata:

networks:
  emailv-net:
    driver: bridge